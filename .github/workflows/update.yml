name: Update schedule

on:
  schedule:
    - cron: "17 21 * * *"   # every day 06:17 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape official events
        run: python scraper/scrape.py
      - name: Keep the schedule alive (GitHub pauses cron after 60 idle days)
        run: |
          if [ "$(date -u +%d)" = "01" ]; then date -u +"%Y-%m-%d" > .keepalive; fi
      - name: Commit changes
        run: |
          git config user.name "schedule-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json .keepalive 2>/dev/null || git add data.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Update schedule data"
          git push
